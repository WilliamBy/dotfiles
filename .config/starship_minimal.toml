# ~/.config/starship.toml

command_timeout = 1000

# Use custom format
format = '''
$username$hostname$directory$git_branch$git_status$env_var$fill$package$lua$golang$python$java$conda | $time|
[\$ ](fg:red)'''

# Wait 30 milliseconds for starship to check files under the current directory.
scan_timeout = 30

# Disable the blank line at the start of the prompt
add_newline = false

[username]
show_always = true
format = "[#](bold fg:202) [$user]($style) "

[hostname]
ssh_symbol = "@"
format = "[[$ssh_symbol](fg:red) [$hostname ](fg:blue)]($style)"

[fill]
symbol = ' '
style = 'bold green'

[time]
disabled = false
format = '[$time]($style) '

[env_var.http_proxy]
format = "[*](fg:green)"

[c]
symbol = "[c/c++ ](fg:pink)"

[conda]
format = '[$symbol$environment](bold)'
symbol = "| [conda ](fg:green)"
ignore_base = true

[directory]
read_only = "[ro]"
truncation_length = 4
format = "[in](fg:white) [$path]($style)[$read_only]($read_only_style) "

[docker_context]
symbol = "| [docker ](fg: blue)"

[git_branch]
symbol = ""

[golang]
symbol = "| [golang ](fg:blue)"

[java]
symbol = "| [java ](fg:red)"

[lua]
symbol = "| [lua ](fg:blue)"

[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )](bold)'
symbol = "| [python ](fg:yellow)"
pyenv_version_name = false
detect_files = [
    '.python-version',
    'Pipfile',
    '__init__.py',
    'pyproject.toml',
    'requirements.txt',
    'setup.py',
    'tox.ini',
    'pyvenv.cfg',
]
detect_folders = ['pyvenv']
